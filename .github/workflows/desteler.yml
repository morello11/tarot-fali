name: Yeni desteleri indir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sola Busca ve Jean Dodal destelerini indir (kamu mali)
        run: |
          mkdir -p img2
          : > img2/report.txt
          fetch() { # $1 = commons dosya adi, $2 = hedef — orijinal dosya, kibar tempoda
            curl -sL --retry 4 --retry-delay 5 --retry-all-errors --max-time 90 \
              -A "tarot-fali-app/1.0 (github.com/morello11/tarot-fali; egitim amacli)" \
              -o "img2/$2" \
              "https://commons.wikimedia.org/wiki/Special:FilePath/$1"
            if [ "$(stat -c%s "img2/$2" 2>/dev/null || echo 0)" -lt 5000 ]; then
              rm -f "img2/$2"
              echo "YOK $2 ($1)" >> img2/report.txt
              return 1
            fi
            sleep 0.4
          }
          for i in $(seq 0 77); do
            n=$(printf '%02d' "$i")
            fetch "Sola_Busca_tarot_card_$n.jpg" "sola_$n.jpg" || true
          done
          fetch "Jean_Dodal_Tarot_trump_Fool.jpg" "dodal_t00.jpg" || true
          for i in $(seq 1 21); do
            n=$(printf '%02d' "$i")
            fetch "Jean_Dodal_Tarot_trump_$n.jpg" "dodal_t$n.jpg" || true
          done
          for suit in cups coins swords batons; do
            for r in $(seq 1 14); do
              nn=$(printf '%02d' "$r")
              fetch "Jean_Dodal_Tarot_${suit}_${nn}.jpg" "dodal_${suit}_${nn}.jpg" || true
            done
          done
          # buyuk taramalari kucult (sayfa hizli yuklensin)
          sudo apt-get -y install imagemagick >/dev/null 2>&1 || true
          for f in img2/*.jpg; do
            [ -f "$f" ] || continue
            w=$(identify -format '%w' "$f" 2>/dev/null || echo 0)
            if [ "$w" -gt 450 ]; then
              mogrify -resize 400x -quality 82 "$f" || true
            fi
          done
          echo "--- indirilen: $(ls img2 | grep -c jpg || true) dosya ---" >> img2/report.txt
          ls img2 >> img2/report.txt
      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add img2
          git commit -m "Sola Busca ve Jean Dodal deste gorselleri (kamu mali, Wikimedia Commons)"
          git push
