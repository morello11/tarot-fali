name: Yeni desteleri indir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  listele:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Acik kaynak deste arsivini listele
        run: |
          git clone --depth 1 https://github.com/mixvlad/TarotCards /tmp/kartlar
          mkdir -p img2
          {
            echo "== dizinler =="
            find /tmp/kartlar -maxdepth 3 -type d | sort
            echo ""
            echo "== boyutlar =="
            du -sh /tmp/kartlar/* 2>/dev/null
            echo ""
            echo "== dosyalar (gorsel) =="
            find /tmp/kartlar -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | sort
            echo ""
            echo "== lisans/readme dosyalari =="
            find /tmp/kartlar -maxdepth 2 -type f \( -iname 'README*' -o -iname 'LICENSE*' -o -iname '*.md' \) | sort
          } > img2/kaynak-listesi.txt
          wc -l img2/kaynak-listesi.txt
      - name: Listeyi depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add img2/kaynak-listesi.txt
          git commit -m "Deste arsivi dosya listesi"
          git push
