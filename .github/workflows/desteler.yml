name: Yeni desteleri indir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sola Busca ve Jean Dodal destelerini indir (kamu mali)
        run: |
          mkdir -p img2
          : > img2/report.txt
          : > /tmp/list.txt
          add() { echo "$1 $2" >> /tmp/list.txt; }
          # Sola Busca (1491): 00-77 tam deste (orijinaller zaten kucuk)
          for i in $(seq 0 77); do
            n=$(printf '%02d' "$i")
            add "Sola_Busca_tarot_card_$n.jpg" "sola_$n.jpg"
          done
          # Jean Dodal (1701) buyuk kartlar
          add "Jean_Dodal_Tarot_trump_Fool.jpg" "dodal_t00.jpg"
          for i in $(seq 1 21); do
            n=$(printf '%02d' "$i")
            add "Jean_Dodal_Tarot_trump_$n.jpg" "dodal_t$n.jpg"
          done
          # Jean Dodal kucuk kartlar (muhtemel isim kaliplari)
          for suit in cups coins swords batons; do
            for r in $(seq 1 14); do
              nn=$(printf '%02d' "$r")
              add "Jean_Dodal_Tarot_${suit}_${nn}.jpg" "dodal_${suit}_${nn}.jpg"
            done
          done
          fetchone() {
            src="$1"; out="$2"
            curl -sL --max-time 25 -o "img2/$out" \
              "https://commons.wikimedia.org/wiki/Special:FilePath/$src?width=400" || true
            if [ "$(stat -c%s "img2/$out" 2>/dev/null || echo 0)" -lt 5000 ]; then
              curl -sL --max-time 40 -o "img2/$out" \
                "https://commons.wikimedia.org/wiki/Special:FilePath/$src" || true
            fi
            if [ "$(stat -c%s "img2/$out" 2>/dev/null || echo 0)" -lt 5000 ]; then
              rm -f "img2/$out"
              echo "YOK $out ($src)" >> img2/report.txt
            fi
          }
          export -f fetchone
          xargs -P 8 -n 2 bash -c 'fetchone "$0" "$1"' < /tmp/list.txt
          echo "--- indirilen: $(ls img2 | grep -c jpg) dosya ---" >> img2/report.txt
          ls img2 >> img2/report.txt
      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add img2
          git commit -m "Sola Busca ve Jean Dodal deste gorselleri (kamu mali, Wikimedia Commons)"
          git push
